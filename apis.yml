aid: freshtohome
name: FreshToHome
description: 'FreshToHome (Freshtohome Foods Private Limited) is a Bangalore-headquartered
  direct-to-consumer e-commerce company selling fresh, antibiotic-residue-free fish,
  seafood, poultry, mutton, ready-to-cook and heat-and-eat food. Founded in 2015 by
  Shan Kadavil, Mathew Joseph and Jayesh Jose, it runs its own farm-and-boat-to-doorstep
  cold chain, sourcing from thousands of fishermen and farmers and delivering across
  cities in India and the United Arab Emirates. The company sells through its website
  and its consumer iOS and Android apps. It publishes an llms.txt at its web root but
  operates no public developer program, API reference, or machine-readable API contract.'
