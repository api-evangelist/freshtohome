x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    FreshToHome is a direct-to-consumer food e-commerce business, not a software vendor,
    and it markets no API: there is no developer host (developers., docs., apis. all
    NXDOMAIN), no developer link anywhere in the site navigation or footer, no GitHub
    organization, and no client library on npm, PyPI, RubyGems, crates.io or Packagist.
    The one API host that does resolve, api.freshtohome.com, is the private backend for
    its own consumer web and mobile apps — it answers every path, including every
    /.well-known/ path and every OpenAPI/Swagger/GraphQL location, with HTTP 400
    {"success":"error","message":"No token provided."}, and no public reference for it is
    published anywhere. The single machine-readable document the company does serve is a
    genuine hand-authored llms.txt at the web root, captured verbatim in llms/, and it
    describes seven product categories and the support and legal pages — it names no API.
